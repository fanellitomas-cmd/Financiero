<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body, #chart { margin: 0; padding: 0; height: 100%; width: 100%; background: #0b0f14; }
  </style>
  <!--
    TODO(producción): esta versión carga Lightweight Charts desde unpkg (requiere internet en
    el dispositivo). Para no depender de un CDN en producción, descargar
    lightweight-charts.standalone.production.js y bundlearlo como asset local
    (assets/charts/lightweight-charts.js) + <script src="lightweight-charts.js"></script>.
  -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="chart"></div>
  <script>
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { background: { color: '#0b0f14' }, textColor: '#d1d5db' },
      grid: {
        vertLines: { color: '#1f2933' },
        horzLines: { color: '#1f2933' }
      },
      timeScale: { timeVisible: true, secondsVisible: false },
      width: window.innerWidth,
      height: window.innerHeight
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#22c55e',
      downColor: '#ef4444',
      borderVisible: false,
      wickUpColor: '#22c55e',
      wickDownColor: '#ef4444'
    });

    // Llamado desde Flutter (LightweightChartView._pushData) vía controller.runJavaScript
    // cada vez que cambian los candles — ver lib/features/asset_detail/widgets/lightweight_chart_view.dart
    window.setSeriesData = function (data) {
      candleSeries.setData(data);
      chart.timeScale().fitContent();
    };

    window.addEventListener('resize', function () {
      chart.applyOptions({ width: window.innerWidth, height: window.innerHeight });
    });
  </script>
</body>
</html>
